<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800" role="img" aria-labelledby="title desc">
  <title id="title">PayPlus MVP Home Dashboard Wireframe</title>
  <desc id="desc">Designated MVP dashboard flow and layout reference for PayPlus showing header, action required, shortcut grid, featured carousel, upcoming bills, recent activity, and bottom navigation with Pay+ center action. This is not a finalized UI design or exact component specification.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .phone { fill: #ffffff; stroke: #cfd5df; stroke-width: 3; }
      .card { fill: #ffffff; stroke: #d6dbe3; stroke-width: 2; }
      .soft-blue { fill: #eef4ff; stroke: #c7d6f6; stroke-width: 2; }
      .soft-green { fill: #edf8f1; stroke: #c9e8d5; stroke-width: 2; }
      .soft-yellow { fill: #fff7df; stroke: #eadba8; stroke-width: 2; }
      .soft-pink { fill: #fff0f5; stroke: #eccad6; stroke-width: 2; }
      .soft-gray { fill: #f3f5f8; stroke: #d6dbe3; stroke-width: 2; }
      .text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .muted { fill: #697386; }
      .tiny { font-size: 18px; }
      .small { font-size: 22px; }
      .body { font-size: 25px; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .nav { font-size: 22px; font-weight: 600; }
      .route { font-size: 16px; fill: #697386; }
      .buttonText { font-size: 20px; font-weight: 600; }
      .icon { fill: none; stroke: #1f2937; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #e11d48; }
      .white { fill: #ffffff; }
      .line { stroke: #d6dbe3; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="1800"/>
  <rect class="phone" x="40" y="35" width="820" height="1730" rx="58"/>

  <!-- Header -->
  <text class="text heading" x="82" y="112">Hi, John</text>
  <g transform="translate(640 78)">
    <rect x="0" y="10" width="62" height="44" rx="6" class="icon"/>
    <path d="M3 14 L31 37 L59 14" class="icon"/>
    <circle cx="55" cy="8" r="15" class="dot"/>
    <text class="text white tiny" x="50" y="15">1</text>
    <text class="text route" x="-10" y="84">Inbox</text>
  </g>
  <g transform="translate(748 78)">
    <path d="M0 12 H68 V54 H0 Z" class="icon"/>
    <path d="M13 12 C13 26 13 40 13 54" class="icon"/>
    <path d="M36 18 V48" class="icon" stroke-dasharray="6 8"/>
    <text class="text route" x="-6" y="84">Coupons</text>
  </g>

  <!-- Notice / Action Required -->
  <rect class="soft-blue" x="70" y="155" width="760" height="190" rx="30"/>
  <text class="text heading" x="100" y="205">Important Notice / Action Required</text>
  <text class="text body muted" x="100" y="252">Swipe cards. Hide when empty. User can collapse.</text>
  <rect class="white" x="100" y="282" width="470" height="38" rx="18"/>
  <text class="text route" x="122" y="307">Route: task detail / message / request / instruction</text>
  <path d="M775 190 L810 225 M810 190 L775 225" class="icon"/>

  <!-- Shortcut Grid -->
  <rect class="card" x="70" y="380" width="760" height="370" rx="30"/>
  <text class="text heading" x="100" y="430">Shortcut Grid</text>
  <text class="text small muted" x="100" y="466">8 shortcuts shown. Admin default + user reorder. More opens extra services.</text>

  <g transform="translate(105 500)">
    <circle class="soft-green" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="52" text-anchor="middle">Requests</text>
    <text class="text route" x="55" y="82" text-anchor="middle">route</text>
  </g>
  <g transform="translate(285 500)">
    <circle class="soft-green" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="48" text-anchor="middle">Instruc-</text>
    <text class="text buttonText" x="55" y="75" text-anchor="middle">tions</text>
  </g>
  <g transform="translate(465 500)">
    <circle class="soft-green" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="48" text-anchor="middle">Bills &amp;</text>
    <text class="text buttonText" x="55" y="75" text-anchor="middle">Tenancies</text>
  </g>
  <g transform="translate(645 500)">
    <circle class="soft-green" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="62" text-anchor="middle">Receipts</text>
  </g>
  <g transform="translate(105 630)">
    <circle class="soft-gray" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="62" text-anchor="middle">Reminders</text>
  </g>
  <g transform="translate(285 630)">
    <circle class="soft-gray" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="62" text-anchor="middle">Cards</text>
  </g>
  <g transform="translate(465 630)">
    <circle class="soft-pink" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="62" text-anchor="middle">Referral</text>
  </g>
  <g transform="translate(645 630)">
    <circle class="soft-gray" cx="55" cy="55" r="50"/>
    <text class="text buttonText" x="55" y="62" text-anchor="middle">More</text>
  </g>

  <!-- Featured carousel -->
  <text class="text heading" x="82" y="815">Featured / What's New / Hot Offer</text>
  <text class="text route" x="618" y="815">Offers route</text>
  <circle class="card" cx="800" cy="805" r="28"/>
  <path d="M790 792 L805 805 L790 818" class="icon"/>
  <rect class="soft-pink" x="70" y="845" width="760" height="180" rx="28"/>
  <text class="text body" x="110" y="897">Card partner rent campaign</text>
  <text class="text small muted" x="110" y="937">Admin-controlled carousel slot. Routes to offer detail.</text>
  <rect class="white" x="110" y="969" width="190" height="38" rx="19"/>
  <text class="text route" x="136" y="994">CTA: Learn more</text>
  <circle class="dot" cx="410" cy="1001" r="6"/>
  <circle class="muted" cx="435" cy="1001" r="5"/>
  <circle class="muted" cx="458" cy="1001" r="5"/>

  <!-- Upcoming -->
  <text class="text heading" x="82" y="1118">Upcoming Bills / Rent</text>
  <text class="text route" x="650" y="1118">View Bills route</text>
  <circle class="card" cx="800" cy="1108" r="28"/>
  <path d="M790 1095 L805 1108 L790 1121" class="icon"/>
  <rect class="soft-yellow" x="70" y="1148" width="760" height="92" rx="24"/>
  <text class="text body" x="105" y="1188">Management fee</text>
  <text class="text small muted" x="105" y="1221">Due Jun 15 - HK$2,800 - Evidence ok</text>
  <text class="text label" x="690" y="1203">Pay soon</text>
  <rect class="soft-yellow" x="70" y="1260" width="760" height="92" rx="24"/>
  <text class="text body" x="105" y="1300">Rent - Flat A</text>
  <text class="text small muted" x="105" y="1333">Jun rent period - HK$18,000</text>
  <text class="text label" x="676" y="1315">Reminder</text>

  <!-- Recent Activity -->
  <text class="text heading" x="82" y="1395">Recent Activity</text>
  <text class="text route" x="610" y="1395">Recent Activity route</text>
  <circle class="card" cx="800" cy="1385" r="28"/>
  <path d="M790 1372 L805 1385 L790 1398" class="icon"/>
  <rect class="card" x="70" y="1425" width="760" height="72" rx="22"/>
  <text class="text small" x="105" y="1470">Jun 04</text>
  <text class="text small" x="205" y="1470">Rent</text>
  <text class="text small" x="335" y="1470">Payment sent</text>
  <text class="text small" x="560" y="1470">HK$18,000</text>
  <text class="text label" x="710" y="1470">Done</text>
  <rect class="card" x="70" y="1515" width="760" height="72" rx="22"/>
  <text class="text small" x="105" y="1560">Jun 03</text>
  <text class="text small" x="205" y="1560">Fee</text>
  <text class="text small" x="335" y="1560">Instruction saved</text>
  <text class="text small" x="560" y="1560">HK$2,800</text>
  <text class="text label" x="678" y="1560">Pending</text>
  <text class="text route" x="70" y="1615">Designated flow/layout reference only. Final UI design and exact component specification are not defined yet.</text>

  <!-- Bottom nav -->
  <rect class="white" x="40" y="1625" width="820" height="140"/>
  <line class="line" x1="40" y1="1625" x2="860" y2="1625"/>
  <g transform="translate(100 1660)">
    <circle class="soft-blue" cx="0" cy="0" r="32"/>
    <text class="text nav" x="0" y="72" text-anchor="middle">Home</text>
  </g>
  <g transform="translate(250 1660)">
    <circle class="soft-gray" cx="0" cy="0" r="32"/>
    <text class="text nav" x="0" y="72" text-anchor="middle">Bills</text>
  </g>
  <g transform="translate(450 1608)">
    <circle class="soft-green" cx="0" cy="40" r="78"/>
    <text class="text heading" x="0" y="50" text-anchor="middle">Pay+</text>
    <text class="text route" x="0" y="78" text-anchor="middle">opens sheet</text>
  </g>
  <g transform="translate(650 1660)">
    <circle class="soft-pink" cx="0" cy="0" r="32"/>
    <text class="text nav" x="0" y="72" text-anchor="middle">Offers</text>
  </g>
  <g transform="translate(800 1660)">
    <circle class="soft-gray" cx="0" cy="0" r="32"/>
    <text class="text nav" x="0" y="72" text-anchor="middle">Me</text>
  </g>
</svg>
